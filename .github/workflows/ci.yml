name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Install package and test dependencies
        run: python -m pip install -c requirements-lock.txt ".[ui,dev]"
      - run: python -m pip check
      - name: Synthetic and integration tests
        run: python -m pytest --cov=cbct_width --cov-report=term-missing
      - name: Build distributions
        run: python -m build
      - name: CLI smoke test
        run: cbct-width demo --output demo-output

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -t cbct-width:test .
      - name: Exercise the container's synthetic measurement path
        run: docker run --rm cbct-width:test demo --output /work/demo
